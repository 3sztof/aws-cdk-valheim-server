repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks-system
        pass_filenames: false

  - repo: https://github.com/bridgecrewio/checkov
    rev: 3.2.346
    hooks:
      - id: checkov
        args: [--framework, cloudformation, --directory, cdk.out, --quiet, --compact]
        files: ^cdk\.out/
        pass_filenames: false

  # Python: lint + format check
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff
        args: [--fix]
        files: ^lambda/
      - id: ruff-format
        files: ^lambda/

  # Python: type checking with ty
  - repo: local
    hooks:
      - id: ty
        name: ty (Python type check)
        entry: ty check
        language: system
        types: [python]
        files: ^lambda/
        pass_filenames: false
        args: [lambda/control, lambda/auto-shutdown]

  # TypeScript: type checking with tsc
  - repo: local
    hooks:
      - id: tsc
        name: tsc (TypeScript type check)
        entry: npx tsc --noEmit
        language: system
        types_or: [ts]
        pass_filenames: false
